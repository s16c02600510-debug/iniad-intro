<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INIADの紹介</title>
    <style>
        :root {
            --bg-start: #edf8fb;
            --bg-end: #f8f6ef;
            --paper: #ffffff;
            --ink: #19324a;
            --muted: #52677b;
            --accent: #0a7c8b;
            --accent-soft: #e6f5f6;
            --line: #dfeaf1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 20px;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--ink);
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            line-height: 1.8;
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: clamp(24px, 5vw, 52px);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: 0 18px 40px rgba(25, 50, 74, 0.08);
        }

        h1 {
            margin: 0 0 28px;
            padding-bottom: 18px;
            border-bottom: 3px solid var(--accent);
            color: var(--ink);
            font-size: clamp(2rem, 5vw, 2.9rem);
            line-height: 1.3;
            letter-spacing: 0.04em;
        }

        h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 32px 0 16px;
            font-size: 1.4rem;
            color: var(--accent);
        }

        h2::before {
            display: inline-block;
            width: 8px;
            height: 1.4em;
            border-radius: 999px;
            background: var(--accent);
            content: "";
        }

        p {
            margin: 0;
            font-size: 1.05rem;
            color: var(--muted);
        }

        ul {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            list-style: none;
            padding: 0;
            margin: 18px 0 0;
        }

        li {
            position: relative;
            padding: 14px 12px 14px 42px;
            background: var(--accent-soft);
            border: 1px solid #d5ebee;
            border-radius: 12px;
            color: var(--ink);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        li::before {
            position: absolute;
            left: 16px;
            top: 12px;
            content: "✦";
            color: var(--accent);
            font-size: 0.9rem;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(10, 124, 139, 0.08);
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 12px;
            }

            main {
                border-radius: 16px;
            }

            ul {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>INIADの紹介</h1>

        <h2>概要</h2>
        <p>
            INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。
            さらに、ソースプログラム管理システム「Git」を用いたチームでのWebサービス開発も学びます。
        </p>

        <h2>科目群一覧</h2>
        <ul>
            <li>コンピュータ・システム</li>
            <li>コンピュータ・ソフトウェア</li>
            <li>ユーザ・エクスペリエンス</li>
            <li>データサイエンス</li>
            <li>ICT社会応用</li>
            <li>連携科目群</li>
            <li>ビジネス構築</li>
            <li>コミュニティ形成</li>
        </ul>
    </main>
</body>
</html>
