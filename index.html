<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INIADの紹介</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f2f7f8;
            --paper: #ffffff;
            --ink: #172f46;
            --muted: #52677b;
            --accent: #087f8c;
            --accent-dark: #075d6a;
            --accent-soft: #e9f5f5;
            --line: #dce8eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(24px, 6vw, 72px) 20px;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(119, 198, 205, 0.18), transparent 34rem),
                linear-gradient(145deg, #eef7f9 0%, #f8f7f1 100%);
            color: var(--ink);
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            line-height: 1.85;
        }

        main {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: clamp(28px, 6vw, 64px);
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(220, 232, 235, 0.9);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(24, 58, 75, 0.11);
        }

        main::before {
            position: absolute;
            inset: 0 0 auto;
            height: 7px;
            background: linear-gradient(90deg, var(--accent-dark), #36a5a5 60%, #a8d7ce);
            content: "";
        }

        h1 {
            margin: 0 0 36px;
            padding: 8px 0 24px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: clamp(2rem, 5vw, 3.1rem);
            font-weight: 750;
            line-height: 1.3;
            letter-spacing: 0.045em;
        }

        h1::after {
            display: block;
            width: 76px;
            height: 4px;
            margin-top: 20px;
            border-radius: 999px;
            background: var(--accent);
            content: "";
        }

        h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 36px 0 16px;
            color: var(--accent-dark);
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.5;
        }

        h2::before {
            flex: 0 0 7px;
            width: 7px;
            height: 1.35em;
            border-radius: 999px;
            background: var(--accent);
            content: "";
        }

        h1 + h2 {
            margin-top: 0;
        }

        p {
            margin: 0;
            padding: 20px 22px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #f8fbfb;
            color: var(--muted);
            font-size: 1.02rem;
        }

        ul {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }

        li {
            position: relative;
            min-height: 64px;
            display: flex;
            align-items: center;
            padding: 14px 16px 14px 48px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: linear-gradient(115deg, var(--accent-soft), #f7fbfa);
            color: var(--ink);
            font-weight: 600;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        li::before {
            position: absolute;
            left: 17px;
            top: 50%;
            display: grid;
            width: 20px;
            height: 20px;
            place-items: center;
            transform: translateY(-50%);
            border-radius: 50%;
            background: #d1eceb;
            color: var(--accent-dark);
            content: "✦";
            font-size: 0.72rem;
        }

        li:hover {
            transform: translateY(-3px);
            border-color: #9dcfd0;
            box-shadow: 0 10px 22px rgba(8, 127, 140, 0.1);
        }

        @media (max-width: 560px) {
            body {
                padding: 18px 12px;
            }

            main {
                padding: 30px 22px;
                border-radius: 18px;
            }

            h1 {
                margin-bottom: 30px;
            }

            h2 {
                margin-top: 30px;
            }

            p {
                padding: 16px;
                font-size: 0.98rem;
            }

            ul {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>INIADの紹介</h1>

        <h2>概要</h2>
        <p>
            INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。
            さらに、ソースプログラム管理システム「Git」を用いたチームでのWebサービス開発も学びます。
        </p>

        <h2>科目群一覧</h2>
        <ul>
            <li>コンピュータ・システム</li>
            <li>コンピュータ・ソフトウェア</li>
            <li>ユーザ・エクスペリエンス</li>
            <li>データサイエンス</li>
            <li>ICT社会応用</li>
            <li>連携科目群</li>
            <li>ビジネス構築</li>
            <li>コミュニティ形成</li>
        </ul>
    </main>
</body>
</html>
